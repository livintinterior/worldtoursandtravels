<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" aria-hidden="true">
  <!-- Faint dot grid texture -->
  <g fill="#60A5FA" opacity="0.18">
    <circle cx="40" cy="60" r="3"/><circle cx="90" cy="60" r="3"/><circle cx="140" cy="60" r="3"/>
    <circle cx="40" cy="110" r="3"/><circle cx="90" cy="110" r="3"/><circle cx="140" cy="110" r="3"/>
    <circle cx="460" cy="500" r="3"/><circle cx="510" cy="500" r="3"/><circle cx="560" cy="500" r="3"/>
    <circle cx="460" cy="550" r="3"/><circle cx="510" cy="550" r="3"/><circle cx="560" cy="550" r="3"/>
  </g>

  <!-- Large translucent orbit ring -->
  <circle cx="330" cy="300" r="230" stroke="#22C55E" stroke-opacity="0.18" stroke-width="1.5"/>
  <circle cx="330" cy="300" r="170" stroke="#60A5FA" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- Dashed travel route -->
  <path d="M90 470 C 160 420, 150 320, 230 280 S 380 220, 420 140 S 470 90, 540 70" stroke="#22C55E" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.85"/>

  <!-- Location pins along the route -->
  <g>
    <circle cx="90" cy="470" r="10" fill="#22C55E"/>
    <circle cx="90" cy="470" r="18" stroke="#22C55E" stroke-width="1.5" opacity="0.5"/>
  </g>
  <g>
    <circle cx="230" cy="280" r="8" fill="#FFFFFF"/>
    <circle cx="230" cy="280" r="15" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>
  </g>
  <g>
    <circle cx="540" cy="70" r="12" fill="#60A5FA"/>
    <circle cx="540" cy="70" r="20" stroke="#60A5FA" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Car silhouette on the route -->
  <g transform="translate(320,150)">
    <path d="M0 28 L8 8 C10 3 14 0 20 0 H55 C61 0 65 3 67 8 L75 28 H0 Z" fill="#FFFFFF" opacity="0.95"/>
    <rect x="0" y="28" width="75" height="10" rx="4" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="16" cy="40" r="8" fill="#1E3A8A"/>
    <circle cx="16" cy="40" r="8" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="59" cy="40" r="8" fill="#1E3A8A"/>
    <circle cx="59" cy="40" r="8" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="22" y="6" width="14" height="14" rx="2" fill="#1E3A8A" opacity="0.6"/>
    <rect x="40" y="6" width="14" height="14" rx="2" fill="#1E3A8A" opacity="0.6"/>
  </g>

  <!-- Bus silhouette lower-left -->
  <g transform="translate(70,330)">
    <rect x="0" y="0" width="90" height="46" rx="8" fill="#22C55E" opacity="0.9"/>
    <rect x="8" y="8" width="18" height="14" rx="2" fill="#0F3D22"/>
    <rect x="32" y="8" width="18" height="14" rx="2" fill="#0F3D22"/>
    <rect x="56" y="8" width="18" height="14" rx="2" fill="#0F3D22"/>
    <circle cx="20" cy="50" r="8" fill="#1E3A8A"/>
    <circle cx="20" cy="50" r="8" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="70" cy="50" r="8" fill="#1E3A8A"/>
    <circle cx="70" cy="50" r="8" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Airplane near top-right pin -->
  <g transform="translate(455,45) rotate(35)">
    <path d="M0 8 L34 8 L44 2 L48 4 L42 10 L48 16 L44 18 L34 12 L0 12 L-8 20 L-13 20 L-8 10 L-13 0 L-8 0 Z" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>
